<aside class="sidebar">
  <nav class="sidebar-nav" aria-label="Main navigation">
    <ul class="nav-links">
      <li>
        <a routerLink="/overview" routerLinkActive="active-link" class="nav-button">
          <mat-icon>home</mat-icon>
          <span i18n="@@sidebarOverviewLabel">Overview</span>
        </a>
      </li>
      <li>
        <a routerLink="#" routerLinkActive="active-link" class="nav-button">
          <mat-icon>show_chart</mat-icon>
          <span i18n="@@sidebarMonitorsLabel">Monitors</span>
        </a>
      </li>
      <li>
        <a routerLink="#" routerLinkActive="active-link" class="nav-button">
          <mat-icon>notifications</mat-icon>
          <span i18n="@@sidebarAlertsLabel">Alerts</span>
        </a>
      </li>
      <li>
        <a routerLink="#" routerLinkActive="active-link" class="nav-button">
          <mat-icon>people</mat-icon>
          <span i18n="@@sidebarMembersLabel">Members</span>
        </a>
      </li>
      <li>
        <a routerLink="#" routerLinkActive="active-link" class="nav-button">
          <mat-icon>settings</mat-icon>
          <span i18n="@@sidebarSettingsLabel">Settings</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="org-switcher">
    <mat-icon>business</mat-icon>
    <span class="org-name">
      @if (tokenStorage.organizationName(); as organizationName) {
        {{ organizationName }}
      } @else {
        <ng-container i18n="@@sidebarOrganizationFallback">Organization</ng-container>
      }
    </span>
    <mat-icon class="chevron">expand_more</mat-icon>
  </div>
</aside>
