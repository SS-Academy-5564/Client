@if (monitorId() !== null) {
  <app-monitor-form-panel
    [initialValue]="initialValue()"
    [isLoadingInitial]="isLoadingDetail()"
    [serverErrors]="serverErrors()"
    [showStatus]="true"
    [submitLabel]="panelSubmitLabel"
    [submitting]="submitting()"
    [subtitle]="panelSubtitle"
    [title]="panelTitle"
    (closed)="onClose()"
    (submitted)="onSubmit($event)" />
}
