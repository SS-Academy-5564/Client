<div class="page-shell">
  <div class="logo-container">
    <app-logo />
  </div>

  <div class="page-container">
    <mat-card class="surface-card">
      <mat-card-header>
        <div class="title-group">
          <mat-card-title i18n="@@forgotPasswordTitle">Forgot Password?</mat-card-title>
          <p class="subtitle" i18n="@@forgotPasswordSubtitle">Enter your email to receive a password reset code.</p>
        </div>
      </mat-card-header>

      <mat-card-content>
        <app-error-message [message]="passwordResetService.error()" />

        <form class="forgot-password-form" [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="input-group">
            <label class="field-label" for="email" i18n="@@forgotPasswordEmailLabel">Email</label>
            <mat-form-field appearance="outline" class="full-width">
              <input
                formControlName="email"
                id="email"
                matInput
                placeholder="email@example.com"
                i18n-placeholder="@@forgotPasswordEmailPlaceholder"
                type="email" />
              @if (form.get('email')?.hasError('required')) {
                <mat-error i18n="@@forgotPasswordEmailRequired">Email is required</mat-error>
              }
              @if (form.get('email')?.hasError('email')) {
                <mat-error i18n="@@forgotPasswordEmailInvalid">Enter a valid email address</mat-error>
              }
            </mat-form-field>
          </div>

          <app-button
            buttonType="submit"
            label="Send Code"
            i18n-label="@@forgotPasswordSubmitButton"
            type="primary"
            variant="full-width"
            [disabled]="form.invalid" />
        </form>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="footer-link">
    <a class="link-primary" i18n="@@forgotPasswordBackToLogin" routerLink="/login">Back to Login</a>
  </div>
</div>
