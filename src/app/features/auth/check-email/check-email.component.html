<div class="page-shell">
  <div class="logo-container">
    <app-logo />
  </div>

  <div class="page-container">
    <main class="surface-card verification-card">
      <div aria-hidden="true" class="status-icon status-icon-info">
        <svg viewBox="0 0 24 24">
          <rect height="16" rx="2" width="20" x="2" y="4" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
      </div>

      <h1 class="verification-title" i18n="@@checkEmailTitle">Check your email</h1>
      <p class="verification-message" i18n="@@checkEmailMessage">
        We sent you a verification email. Open the link in that message to finish creating your Pulse account.
      </p>
      <p class="verification-hint" i18n="@@checkEmailHint">If you don't see it, check your spam or junk folder.</p>

      <div class="verification-actions">
        <app-button
          label="Sign in"
          i18n-label="@@checkEmailSignIn"
          type="primary"
          variant="full-width"
          [routerLink]="routes.LOGIN" />
      </div>
    </main>
  </div>
</div>
