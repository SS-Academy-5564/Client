<div class="page-shell">
  <div class="logo-container">
    <app-logo />
  </div>

  <div class="page-container">
    <mat-card class="surface-card">
      <mat-card-header>
        <div class="title-group">
          <mat-card-title i18n="@@verifyCodeTitle">Verify Code</mat-card-title>
          <p class="subtitle">
            <span i18n="@@verifyCodeSubtitle">Code sent to</span>
            {{ email() }}
          </p>
        </div>
      </mat-card-header>

      <mat-card-content>
        <app-error-message [message]="passwordResetService.error()" />

        <div class="code-form">
          <div class="code-inputs" (paste)="onPaste($event)">
            @for (digit of codeDigits(); track $index) {
              <input
                #codeInput
                class="code-input"
                inputmode="numeric"
                maxlength="1"
                type="text"
                [attr.aria-label]="'Digit ' + ($index + 1)"
                [value]="digit"
                (input)="onDigitInput($index, $event)"
                (keydown)="onDigitKeydown($index, $event)"
                (keypress)="onDigitKeypress($event)" />
            }
          </div>

          <app-button
            buttonType="button"
            label="Verify"
            i18n-label="@@verifyCodeSubmitButton"
            type="primary"
            variant="full-width"
            [disabled]="isSubmitting()"
            (click)="onSubmit()" />

          <p class="resend-section">
            <span class="resend-text" i18n="@@verifyCodeResendPrompt">Didn't receive a code?</span>
            @if (resendDisabled()) {
              <span class="resend-text resend-countdown">Resend in {{ resendCountdown() }}s</span>
            } @else {
              <button class="resend-button" i18n="@@verifyCodeResendButton" type="button" (click)="resendCode()">
                Resend Code
              </button>
            }
          </p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="footer-link">
    <a class="link-primary" i18n="@@verifyCodeBackToLogin" routerLink="/login">Back to Login</a>
  </div>
</div>
